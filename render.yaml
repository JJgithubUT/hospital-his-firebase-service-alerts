services:
  - type: web
    name: hospital-his-firebase-service-alerts
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      # Los siguientes son SECRETOS: no tienen valor aquí a propósito.
      # Al crear el servicio desde este Blueprint, Render te pedirá rellenarlos
      # en el dashboard (Environment). También puedes editarlos ahí en cualquier
      # momento sin tocar el código ni volver a hacer push.
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_MEASUREMENT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
